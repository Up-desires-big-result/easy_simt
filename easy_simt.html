<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easy_simt 指令级演示</title>
<style>
  :root{
    --amber:#D97706; --blue:#2563EB; --violet:#7C3AED; --cyan:#0891B2;
    --green:#16A34A; --red:#DC2626; --dark:#1E293B; --ink:#334155;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:#F1F5F9;color:var(--ink)}
  header{padding:12px 22px 4px}
  header h1{font-size:19px;margin:0}
  header p{font-size:12px;color:#64748B;margin:3px 0 0}
  .wrap{display:flex;gap:14px;padding:12px 22px 24px;align-items:flex-start;flex-wrap:wrap}
  .stage{flex:1 1 760px;min-width:720px;background:#fff;border:1px solid #E2E8F0;border-radius:10px;
         box-shadow:0 1px 3px rgba(15,23,42,.06);position:relative;overflow:visible}
  .stage svg{display:block;width:100%;height:auto}
  .payload{position:absolute;z-index:5;transform:translate(-50%,-115%);pointer-events:none;
           font-size:10.5px;font-family:Consolas,Menlo,monospace;color:#fff;
           padding:2px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 4px rgba(15,23,42,.25)}
  aside{flex:0 0 340px;min-width:300px;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;
        box-shadow:0 1px 3px rgba(15,23,42,.06);padding:12px 14px}
  .ctrl{display:flex;align-items:center;gap:8px}
  .ctrl button{border:1px solid #CBD5E1;background:#fff;border-radius:7px;padding:5px 12px;
               font-size:13px;cursor:pointer;color:var(--ink)}
  .ctrl button:hover{background:#F1F5F9}
  .ctrl .play{background:#1E293B;color:#fff;border-color:#1E293B;width:64px}
  .frameidx{font-size:12px;color:#64748B;margin-left:auto;font-family:Consolas,Menlo,monospace}
  .progress{margin-top:10px;height:6px;background:#F1F5F9;border-radius:3px;position:relative;cursor:pointer}
  .progress .fill{height:100%;background:#2563EB;border-radius:3px;width:0%}
  .ticklist{display:flex;gap:2px;margin-top:6px}
  .tick{flex:1;height:4px;border-radius:2px;background:#E2E8F0}
  .tick.done{background:#93C5FD}
  .tick.cur{background:#2563EB}
  .step h2{font-size:14px;margin:0 0 2px;color:#0F172A}
  .step .chname{font-size:11px;font-family:Consolas,Menlo,monospace;color:#2563EB;margin:0 0 6px;word-break:break-all}
  .step .iinfo{font-size:11.5px;font-family:Consolas,Menlo,monospace;margin:0 0 6px;
               background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:4px 8px;word-break:break-all}
  .step .iinfo .hex{color:#7C3AED;font-weight:700}
  .step .iinfo .asm{color:#0F172A;font-weight:700}
  .step .iinfo .ptx{color:#94A3B8;font-size:10.5px}
  .step p{font-size:12px;line-height:1.7;margin:6px 0 0}
  .step .pl{font-size:11px;font-family:Consolas,Menlo,monospace;background:#F8FAFC;border:1px solid #E2E8F0;
            border-radius:6px;padding:5px 8px;margin-top:7px;color:#334155;word-break:break-all}
  .state h3{font-size:12px;color:#64748B;margin:0 0 6px;font-weight:600}
  .ctx{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;margin-bottom:8px}
  .ctx .k{color:#94A3B8}
  .ctx .v{font-family:Consolas,Menlo,monospace}
  .regs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
  .reg{border:1px solid #E2E8F0;border-radius:6px;padding:3px 2px;text-align:center;min-width:0}
  .reg .rn{font-size:9.5px;color:#94A3B8;font-family:Consolas,Menlo,monospace}
  .reg .rv{font-size:9.5px;font-family:Consolas,Menlo,monospace;color:#0F172A;
           word-break:break-all;line-height:1.25;margin-top:1px}
  .reg.chg{border-color:#2563EB;background:#EFF6FF}
  .reg.chg .rv{color:#1D4ED8;font-weight:700}
  .reg .rv.plv{color:#B45309;font-weight:700}
  .plwrap{margin-top:8px}
  .plwrap .plhd{font-size:12px;color:#64748B;margin:0 0 6px;font-weight:600}
  .pltab{display:grid;grid-template-columns:auto repeat(8,minmax(0,1fr));gap:2px;
         font-family:Consolas,Menlo,monospace;font-size:9px}
  .pltab .h{color:#94A3B8;text-align:center}
  .pltab .rn{color:#64748B;align-self:center}
  .pltab .c{border:1px solid #E2E8F0;border-radius:4px;text-align:center;padding:2px 0;
            color:#0F172A;line-height:1.2;min-width:0}
  .pltab .c.chg{border-color:#2563EB;background:#EFF6FF;color:#1D4ED8;font-weight:700}
  .stats{font-size:10.5px;color:#94A3B8;margin-top:8px}
  .hint{font-size:11px;color:#94A3B8;margin-top:8px}
  /* ---- svg ---- */
  .blk{cursor:default}
  svg.dimming .blk{opacity:.42}
  svg.dimming .blk.hi{opacity:1}
  .edge{visibility:hidden}
  .edge.hi{visibility:visible}
  .edge path{fill:none;stroke-width:2;opacity:.9}
  .edge.hi path{stroke-width:2.6;stroke-dasharray:9 6;animation:dash .7s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-15}}
  .bname{font-size:14px;font-weight:700;fill:#0F172A}
  .bfull{font-size:9.5px;fill:#475569}
  .brole{font-size:9.5px;fill:#64748B}
  .die-t{font-size:11px;fill:#94A3B8;font-family:Consolas,Menlo,monospace}
  .cell{fill:#EDF2F7;stroke:#D5DDE6;stroke-width:.6}
  .cell.on{fill:#16A34A;stroke:#14532D}
  .cellnum{font-size:11px;fill:#94A3B8;font-family:Consolas,Menlo,monospace}
  .cellnum.on{fill:#F0FDF4}
  .cellcap{font-size:8.5px;fill:#94A3B8;font-family:Consolas,Menlo,monospace}
  .actline{font-size:9px;fill:#B45309;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
  .actline[font-weight]{font-weight:600}
  .memrow{font-size:8.6px;font-family:Consolas,Menlo,monospace;fill:#475569}
  .memrow.lit{fill:#B91C1C;font-weight:700}
  .imline{fill:#FEF9C3;opacity:0}
  .imline.lit{opacity:1}
  .pagelink{font-size:10px;fill:#2563EB;cursor:pointer;font-family:Consolas,Menlo,monospace}
  .pagelink:hover{fill:#1D4ED8}
  .lg-txt{font-size:10px;fill:#64748B}
  .foot{font-size:10px;fill:#94A3B8}
</style>
</head>

const svg = document.getElementById("svg");
const stagebox = document.getElementById("stagebox");
const blocks = [...svg.querySelectorAll(".blk")];
const edges  = [...svg.querySelectorAll(".edge")];
const edgeByTitle = {};
edges.forEach(e => { edgeByTitle[e.querySelector("title").textContent] = e; });

const NS = "http://www.w3.org/2000/svg";
const cellEls = {};   /* mod -> [{rect,text},...] */
for (const [mod, c] of Object.entries(CELLS)) {
  const g = svg.querySelector(`.cells[data-mod="${mod}"]`);
  const arr = [];
  for (let i = 0; i < c.n; i++) {
    const col = i % c.cols, row = Math.floor(i / c.cols);
    const cx = c.x + col * (c.s + c.g), cy = c.y + row * (c.s + c.g);
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("class", "cell");
    r.setAttribute("x", cx); r.setAttribute("y", cy);
    r.setAttribute("width", c.s); r.setAttribute("height", c.s);
    if (c.v) r.setAttribute("rx", 4);
    g.appendChild(r);
    let t = null;
    if (c.num) {
      t = document.createElementNS(NS, "text");
      t.setAttribute("class", "cellnum");
      t.setAttribute("x", cx + c.s/2); t.setAttribute("y", cy + c.s/2 + 4);
      t.setAttribute("text-anchor", "middle");
      t.textContent = i;
      g.appendChild(t);
    }
    arr.push({r, t});
  }
  cellEls[mod] = arr;
}

let cur = 0, playing = null;

function bubble(edge, text, color) {
  const p = edge.querySelector("path");
  const r = p.getBoundingClientRect(), sr = stagebox.getBoundingClientRect();
  const div = document.createElement("div");
  div.className = "payload";
  div.style.left = (r.left + r.width/2 - sr.left) + "px";
  div.style.top  = (r.top  - sr.top) + "px";
  if (color) div.style.background = color;
  div.innerHTML = text;
  stagebox.appendChild(div);
}
function clearBubbles() { stagebox.querySelectorAll(".payload").forEach(p => p.remove()); }

function setCells(act) {
  for (const [mod, arr] of Object.entries(cellEls)) {
    const bits = (act && act[mod]) || 0;
    arr.forEach(({r, t}, i) => {
      const on = (bits >> i) & 1;
      r.classList.toggle("on", !!on);
      if (t) t.classList.toggle("on", !!on);
    });
  }
}

function render(i) {
  const f = FRAMES[i];
  svg.classList.add("dimming");
  edges.forEach(e => e.classList.remove("hi"));
  blocks.forEach(b => b.classList.remove("hi"));
  const lit = new Set(f.mods);
  f.edges.forEach(([t]) => {
    const e = edgeByTitle[t];
    if (e) { e.classList.add("hi"); e.dataset.m.split(" ").forEach(m => lit.add(m)); }
  });
  Object.keys(f.act || {}).forEach(m => lit.add(m));
  blocks.forEach(b => b.classList.toggle("hi", lit.has(b.dataset.mod)));

  setCells(f.act);

  /* 块内动作描述（多行 tspan）：参与帧的块显示其动作，其余清空 */
  ["bs","ws","icache","rf","ialu","falu","lsu","memif","l1sm"].forEach(m => {
    const arr = (f.ba && f.ba[m]) || [];
    $("act-"+m).querySelectorAll("tspan").forEach((t, i) => t.textContent = arr[i] || "");
  });

  clearBubbles();
  f.edges.forEach(([t, pl]) => {
    const e = edgeByTitle[t];
    if (e) bubble(e, pl, e.querySelector("path").getAttribute("stroke"));
  });

  $("imline").classList.toggle("lit", !!f.imemLit);
  for (let p = 0; p < 8; p++) $("im-pc"+p).classList.toggle("lit", !!f.imemLit || f.cur === imPage*8 + p);

  const wi = IWIN.find(w => w.pc === f.cur);
  $("iinfo").innerHTML =
    `<span class="hex">${wi.hex}</span> <span class="asm">pc ${wi.pc}：${wi.asm}</span> <span class="ptx">${wi.ptx}</span>`;

  $("steptitle").textContent = `帧 ${i+1} · ${f.title}`;
  $("stepch").textContent = f.ch;
  $("stepdesc").textContent = f.desc;
  $("steppl").innerHTML = f.pl;

  $("stPC").textContent = f.st.pc;
  $("stSB").textContent = f.st.sb.length ? f.st.sb.join(" ") + " 待写回" : "空";
  [...$("stMask").children].forEach(d => d.classList.remove("off"));
  /* 谓词 p0..p3：复位值 0；st.pred 记录已写值（位掩码），chg 命中时琥珀高亮 */
  const pr = f.st.pred || {};
  $("stPred").innerHTML = [0,1,2,3].map(k => {
    const key = "p" + k, on = !!(f.chg && f.chg.includes(key)), v = pr[key];
    return `<span${on ? ' style="color:#B45309;font-weight:700"' : ""}>${key}=${v === undefined ? "00000000" : v.toString(2).padStart(8, "0")}</span>`;
  }).join("&nbsp;&nbsp;");
  REGN.forEach(r => {
    const cell = $("reg-"+r).querySelector(".rv");
    const v = f.st.regs[r];
    if (r === "r0") { cell.innerHTML = "0x0000_<br>0000"; cell.title = "R0 恒零"; $("reg-"+r).classList.remove("chg"); return; }
    if (Array.isArray(v)) {                       /* per-lane 值：格内摘要 + 展开表全值 */
      const consec = v.every((x, k) => k === 0 || x === v[k-1] + 1);
      cell.innerHTML = consec ? (v[0] + ".." + v[v.length-1]) : "逐 lane";
      cell.title = r + " = [" + v.join(", ") + "]";
    } else {
      cell.innerHTML = v === undefined ? "—" :
        "0x" + v.toString(16).toUpperCase().padStart(8,"0").slice(0,4) + "_<br>" +
        v.toString(16).toUpperCase().padStart(8,"0").slice(4);
      cell.title = v === undefined ? "" : r + " = " + v;
    }
    $("reg-"+r).classList.toggle("chg", !!(f.chg && f.chg.includes(r)));
  });
  /* per-lane 展开表：本帧存在逐 lane 寄存器时显示 */
  const plRegs = REGN.filter(r => Array.isArray(f.st.regs[r]));
  $("plwrap").hidden = !plRegs.length;
  $("regtitle").textContent = plRegs.length ? "寄存器（warp 0 · 含逐 lane 值）"
                                             : "寄存器（warp 0 · 8 lane 同值）";
  if (plRegs.length) {
    let h = '<span class="h"></span>' + [...Array(8)].map((_, l) => `<span class="h">${l}</span>`).join("");
    for (const r of plRegs)
      h += `<span class="rn">${r}</span>` + f.st.regs[r].map(v => {
        const s = v.toString(16).toUpperCase().padStart(8,"0");
        return `<span class="c${f.chg && f.chg.includes(r) ? " chg" : ""}">${s.slice(0,4)}<br>${s.slice(4)}</span>`;
      }).join("");
    $("pltab").innerHTML = h;
  }
  const c = CNT[i];
  $("stats").textContent = `演示内计数：取指请求 ${c.f} 次 · 回填 ${c.r} 次 · 发射 ${c.i} 条`;

  $("frameidx").textContent = `${i+1} / ${FRAMES.length}`;
  $("pfill").style.width = ((i+1)/FRAMES.length*100) + "%";
  FRAMES.forEach((_, j) => {
    $("tick"+j).classList.toggle("cur", j === i);
    $("tick"+j).classList.toggle("done", j < i);
  });
  cur = i;
}

function goto(i) { render(Math.max(0, Math.min(FRAMES.length-1, i))); }
function step(d) { stopPlay(); goto(cur + d); }
function stopPlay() { if (playing) { clearInterval(playing); playing = null; $("btnPlay").textContent = "▶ 播放"; } }
function togglePlay() {
  if (playing) return stopPlay();
  if (cur >= FRAMES.length-1) goto(0);
  $("btnPlay").textContent = "⏸ 暂停";
  playing = setInterval(() => { if (cur >= FRAMES.length-1) stopPlay(); else goto(cur+1); }, 1800);
}

$("btnPrev").onclick = () => step(-1);
$("btnNext").onclick = () => step(1);
$("btnPlay").onclick = togglePlay;
$("progress").onclick = ev => {
  stopPlay();
  const r = ev.currentTarget.getBoundingClientRect();
  goto(Math.floor((ev.clientX - r.left) / r.width * FRAMES.length));
};
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowLeft") step(-1);
  else if (ev.key === "ArrowRight") step(1);
});

/* ================= IMEM 指令段分页（每页 8 行） ================= */
let imPage = 0;
function renderImem() {
  for (let p = 0; p < 8; p++) {
    const wi = IWIN.find(w => w.pc === imPage*8 + p);
    $("im-pc"+p).textContent = wi ? `${wi.pc} ${wi.hex} ${wi.asm.split(",")[0]}` : "";
  }
  $("impage-btn").textContent = imPage ? "◂ pc 0..7" : "pc 8..15 ▸";
}
$("impage-btn").addEventListener("click", () => { imPage ^= 1; renderImem(); render(cur); });
renderImem();

render(0);
</script>
</body>
</html>
